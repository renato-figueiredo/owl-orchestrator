<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Owl">
  <title>Owl</title>
  <style>
    .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
    .pupils{animation:look 7s ease-in-out infinite}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
    @keyframes look{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(2px)}}
    @media (prefers-reduced-motion:reduce){.eyes,.pupils{animation:none}}
  </style>
  <rect width="96" height="96" rx="22" fill="#1B1B3A"/>
  <!-- brow / ear tufts: a W for "OWL" -->
  <path d="M14 20 L30 42 L48 26 L66 42 L82 20" fill="none" stroke="#F5B942" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- eyes -->
  <g class="eyes">
    <circle cx="32" cy="58" r="14" fill="#F4F1EA"/>
    <circle cx="64" cy="58" r="14" fill="#F4F1EA"/>
    <g class="pupils">
      <circle cx="35" cy="58" r="6.5" fill="#1B1B3A"/><circle cx="37" cy="55.5" r="2" fill="#F4F1EA"/>
      <circle cx="67" cy="58" r="6.5" fill="#1B1B3A"/><circle cx="69" cy="55.5" r="2" fill="#F4F1EA"/>
    </g>
  </g>
  <!-- beak -->
  <path d="M42 66 L54 66 L48 80 Z" fill="#F5B942" stroke="#F5B942" stroke-width="2" stroke-linejoin="round"/>
</svg>
