<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--c-bg);color:var(--c-fg);font-family:var(--font-sans);font-size:13px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 32px;background:var(--c-panel);border:1px solid var(--c-line);border-radius:10px;padding:14px 16px"><div style="display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px"><span style="width:6px;height:6px;border-radius:2px;background:var(--c-prov-claude-cli)"></span>claude-cli<span style="color:var(--c-muted);font-size:10px;margin-left:auto">--c-prov-claude-cli</span></div><div style="display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px"><span style="width:6px;height:6px;border-radius:2px;background:var(--c-prov-codex-cli)"></span>codex-cli<span style="color:var(--c-muted);font-size:10px;margin-left:auto">--c-prov-codex-cli</span></div><div style="display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px"><span style="width:6px;height:6px;border-radius:2px;background:var(--c-prov-ollama)"></span>ollama<span style="color:var(--c-muted);font-size:10px;margin-left:auto">--c-prov-ollama</span></div><div style="display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px"><span style="width:6px;height:6px;border-radius:2px;background:var(--c-prov-other)"></span>outro<span style="color:var(--c-muted);font-size:10px;margin-left:auto">--c-prov-other</span></div></div>
</body></html>
