<!-- @dsCard group="Colors" viewport="700x130" name="Status de execução" subtitle="Forma + cor + texto, sempre" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--c-bg);color:var(--c-fg);font-family:var(--font-sans);font-size:13px">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px"><div style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:var(--c-raised);font-size:12px"><span style="color:var(--c-status-running);font-family:var(--font-mono);width:14px;text-align:center">••</span><span>rodando</span><span style="flex:1"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--c-muted)">running</span></div><div style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:var(--c-raised);font-size:12px"><span style="color:var(--c-status-waiting-human);font-family:var(--font-mono);width:14px;text-align:center">▲</span><span>aguardando você</span><span style="flex:1"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--c-muted)">waiting-human</span></div><div style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:var(--c-raised);font-size:12px"><span style="color:var(--c-status-queued);font-family:var(--font-mono);width:14px;text-align:center">○</span><span>na fila</span><span style="flex:1"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--c-muted)">queued</span></div><div style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:var(--c-raised);font-size:12px"><span style="color:var(--c-status-failed);font-family:var(--font-mono);width:14px;text-align:center">✕</span><span>falhou</span><span style="flex:1"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--c-muted)">failed</span></div><div style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:var(--c-raised);font-size:12px"><span style="color:var(--c-status-done);font-family:var(--font-mono);width:14px;text-align:center">✓</span><span>concluído</span><span style="flex:1"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--c-muted)">done</span></div><div style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:var(--c-raised);font-size:12px"><span style="color:var(--c-status-cancelled);font-family:var(--font-mono);width:14px;text-align:center">—</span><span>cancelado</span><span style="flex:1"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--c-muted)">cancelled</span></div></div>
</body></html>
