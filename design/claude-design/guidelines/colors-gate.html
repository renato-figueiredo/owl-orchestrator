<!-- @dsCard group="Colors" viewport="700x110" name="Gates" subtitle="Pendente âmbar; verde e vermelho só no desfecho" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--c-bg);color:var(--c-fg);font-family:var(--font-sans);font-size:13px">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px"><div style="border:1px solid var(--c-gate-pending);border-radius:10px;padding:12px;background:var(--c-panel);display:flex;flex-direction:column;gap:4px"><span style="color:var(--c-gate-pending);font-weight:600"><i class="icon-shield-alert"></i> pendente</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--c-muted)">--c-gate-pending</span></div><div style="border:1px solid var(--c-line);border-radius:10px;padding:12px;background:var(--c-panel);display:flex;flex-direction:column;gap:4px"><span style="color:var(--c-gate-approved);font-weight:600"><i class="icon-check"></i> aprovado</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--c-muted)">--c-gate-approved</span></div><div style="border:1px solid var(--c-line);border-radius:10px;padding:12px;background:var(--c-panel);display:flex;flex-direction:column;gap:4px"><span style="color:var(--c-gate-rejected);font-weight:600"><i class="icon-x"></i> reprovado</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--c-muted)">--c-gate-rejected</span></div></div>
</body></html>
