<!-- @dsCard group="Colors" viewport="700x150" name="Texto e linhas" subtitle="fg / muted / faint sobre panel" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--c-bg);color:var(--c-fg);font-family:var(--font-sans);font-size:13px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--c-panel);border:1px solid var(--c-line);border-radius:10px;padding:16px">
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:16px;color:var(--c-fg)">--c-fg · texto principal</span><span style="font-size:14px;color:var(--c-muted)">--c-muted · secundário, rótulos</span><span style="font-family:var(--font-mono);font-size:12px;color:var(--c-faint)">--c-faint · metadados ≥ 12px</span></div>
<div style="display:flex;flex-direction:column;gap:10px;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--c-muted)"><div style="border-top:1px solid var(--c-line);padding-top:4px">--c-line · bordas, divisórias</div><div style="border-top:1px solid var(--c-line-strong);padding-top:4px">--c-line-strong · hover de borda</div></div></div>
</body></html>
