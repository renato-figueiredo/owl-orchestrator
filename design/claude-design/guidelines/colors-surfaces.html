<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--c-bg);color:var(--c-fg);font-family:var(--font-sans);font-size:13px">
<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:6px;background:var(--c-chrome);border:1px solid var(--c-line);display:flex;align-items:flex-end;padding:6px;color:var(--c-fg);font-family:var(--font-mono);font-size:11px"></div><div style="font-family:var(--font-mono);font-size:11px">--c-chrome</div><div style="font-size:11px;color:var(--c-muted)">Vigia, trilho</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:6px;background:var(--c-bg);border:1px solid var(--c-line);display:flex;align-items:flex-end;padding:6px;color:var(--c-fg);font-family:var(--font-mono);font-size:11px"></div><div style="font-family:var(--font-mono);font-size:11px">--c-bg</div><div style="font-size:11px;color:var(--c-muted)">Fundo</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:6px;background:var(--c-panel);border:1px solid var(--c-line);display:flex;align-items:flex-end;padding:6px;color:var(--c-fg);font-family:var(--font-mono);font-size:11px"></div><div style="font-family:var(--font-mono);font-size:11px">--c-panel</div><div style="font-size:11px;color:var(--c-muted)">Painéis, colunas</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:6px;background:var(--c-raised);border:1px solid var(--c-line);display:flex;align-items:flex-end;padding:6px;color:var(--c-fg);font-family:var(--font-mono);font-size:11px"></div><div style="font-family:var(--font-mono);font-size:11px">--c-raised</div><div style="font-size:11px;color:var(--c-muted)">Cards, inputs</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:6px;background:var(--c-overlay);border:1px solid var(--c-line);display:flex;align-items:flex-end;padding:6px;color:var(--c-fg);font-family:var(--font-mono);font-size:11px"></div><div style="font-family:var(--font-mono);font-size:11px">--c-overlay</div><div style="font-size:11px;color:var(--c-muted)">Menus, modais</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:56px;border-radius:6px;background:var(--c-user);border:1px solid var(--c-line);display:flex;align-items:flex-end;padding:6px;color:var(--c-fg);font-family:var(--font-mono);font-size:11px"></div><div style="font-family:var(--font-mono);font-size:11px">--c-user</div><div style="font-size:11px;color:var(--c-muted)">Mensagem do usuário</div></div></div>
</body></html>
