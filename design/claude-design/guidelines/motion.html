<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--c-bg);color:var(--c-fg);font-family:var(--font-sans);font-size:13px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:12px">
<div style="background:var(--c-panel);border:1px solid var(--c-line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:4px"><span style="font-family:var(--font-mono);font-size:16px">120ms</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--c-muted)">--dur-fast</span><span style="color:var(--c-muted)">hover, press</span></div><div style="background:var(--c-panel);border:1px solid var(--c-line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:4px"><span style="font-family:var(--font-mono);font-size:16px">180ms</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--c-muted)">--dur</span><span style="color:var(--c-muted)">aparecer, listas</span></div><div style="background:var(--c-panel);border:1px solid var(--c-line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:4px"><span style="font-family:var(--font-mono);font-size:16px">250ms</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--c-muted)">--dur-slow</span><span style="color:var(--c-muted)">painéis</span></div><div style="background:var(--c-panel);border:1px solid var(--c-line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:4px"><span style="font-family:var(--font-mono);font-size:16px">400ms</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--c-muted)">--dur-page</span><span style="color:var(--c-muted)">troca de tela</span></div>
</div><div style="margin-top:12px;font-size:12px;color:var(--c-muted)">ease-out ao aparecer · ease-in ao sumir · spring para card entre colunas · gate: <b style="color:var(--c-fg)">um</b> pulso, depois estável · reduced-motion → instantâneo</div>
</body></html>
