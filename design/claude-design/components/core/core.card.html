<!-- @dsCard group="Components" viewport="700x300" name="Core" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<style>@keyframes owl-spin{to{transform:rotate(360deg)}}</style>
</head><body style="margin:0;padding:20px;background:var(--c-bg);color:var(--c-fg);font-family:var(--font-sans);font-size:13px">
<div id="root"></div>
<script type="text/babel">
const NS = Object.values(window).find(v => v && typeof v === 'object' && v.Button && v.GateCard) || {};
const { Button, IconButton, Kbd, Input, Tabs, Switch } = NS;
function Demo(){ const [t,setT]=React.useState('Quadro'); const [s,setS]=React.useState(true);
return <div style={{display:'flex',flexDirection:'column',gap:16}}>
<div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}><Button variant="primary" icon="check">Aprovar</Button><Button>Secundário</Button><Button variant="ghost">Fantasma</Button><Button variant="danger" icon="square" kbd="⌘.">Cancelar</Button><Button variant="primary" loading>Enviando</Button><Button disabled>Desabilitado</Button></div>
<div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}><Button variant="primary" size="sm" kbd="⌘A">2 aprovações</Button><Button size="lg" icon="plus">Ticket</Button><IconButton icon="message-square" label="Chat" active /><IconButton icon="shield-check" label="Aprovações" badge={2} /><IconButton icon="bot" label="Agentes" /><Kbd>⌘↵</Kbd><Kbd>⌘K</Kbd></div>
<div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}><Tabs items={['Quadro','Lista']} value={t} onChange={setT} /><Switch checked={s} onChange={setS} label="Resumo automático" /><Switch checked={false} label="Desligado" /></div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}><Input label="Pasta" mono placeholder="/home/…/projeto" /><Input label="Nome" defaultValue="x" error="Já existe um projeto com esse nome" /><Input label="Motivo" multiline rows={1} maxLength={280} /></div>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
